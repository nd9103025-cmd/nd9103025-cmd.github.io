<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Supercar Racing</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: radial-gradient(circle, #222, #050505);
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  overflow-x: hidden;
}

h1 {
  margin: 12px 0 2px;
  font-size: 28px;
  letter-spacing: 2px;
}

#score {
  font-size: 20px;
  font-weight: bold;
  margin: 5px 0 10px;
}

/* ROAD */
#game {
  position: relative;
  width: 380px;
  height: 620px;
  max-width: 94vw;
  margin: auto;
  overflow: hidden;

  background:
    repeating-linear-gradient(
      0deg,
      #303030 0px,
      #303030 35px,
      #292929 35px,
      #292929 70px
    );

  border-left: 8px solid white;
  border-right: 8px solid white;
  box-shadow: 0 0 30px #000;
}

/* ROAD LINES */
.roadLine {
  position: absolute;
  width: 7px;
  height: 85px;
  background: white;
  left: 50%;
  transform: translateX(-50%);
  border-radius: 5px;
}

/* =========================
   SUPERCAR
========================= */

.car {
  position: absolute;
  width: 62px;
  height: 100px;
  border-radius: 18px 18px 9px 9px;
}

/* PLAYER CAR */
#player {
  left: 159px;
  bottom: 25px;

  background:
    linear-gradient(
      90deg,
      #6d0000 0%,
      #ff1b1b 25%,
      #ff3030 50%,
      #b00000 75%,
      #5b0000 100%
    );

  border: 2px solid #ff7777;

  box-shadow:
    0 0 10px #ff2222,
    inset 0 0 12px #450000;
}

/* SHARP FRONT */
#player::after {
  content: "";
  position: absolute;

  width: 48px;
  height: 34px;

  left: 5px;
  bottom: -5px;

  background: #111;

  clip-path: polygon(
    0 100%,
    18% 20%,
    50% 0,
    82% 20%,
    100% 100%
  );

  z-index: 2;
}

/* WINDSHIELD */
#player::before {
  content: "";

  position: absolute;

  width: 44px;
  height: 28px;

  left: 7px;
  top: 15px;

  background:
    linear-gradient(
      135deg,
      #b9f6ff,
      #17627d
    );

  border: 2px solid #111;

  border-radius: 9px 9px 5px 5px;

  transform: skewX(-5deg);

  z-index: 3;
}

/* SIDE MIRRORS */
#player {
  outline: 0;
}

#player .mirror {
  position: absolute;
  width: 10px;
  height: 7px;
  background: #111;
  top: 34px;
  border-radius: 4px;
}

#player .mirror.left {
  left: -8px;
}

#player .mirror.right {
  right: -8px;
}

/* WHEELS */
.wheel {
  position: absolute;

  width: 10px;
  height: 25px;

  background: #050505;

  border-radius: 5px;

  box-shadow: 0 0 3px #aaa;

  z-index: 5;
}

.w1 {
  left: -7px;
  top: 15px;
}

.w2 {
  right: -7px;
  top: 15px;
}

.w3 {
  left: -7px;
  bottom: 13px;
}

.w4 {
  right: -7px;
  bottom: 13px;
}

/* =========================
   ENEMY SUPERCAR
========================= */

.enemy {
  top: -120px;

  background:
    linear-gradient(
      90deg,
      #777,
      #ddd,
      #999,
      #555
    );

  border: 2px solid #eee;

  box-shadow: 0 0 10px #aaa;
}

.enemy::before {
  content: "";

  position: absolute;

  width: 44px;
  height: 28px;

  left: 7px;
  top: 15px;

  background:
    linear-gradient(
      135deg,
      #dffaff,
      #236b87
    );

  border: 2px solid #111;

  border-radius: 9px 9px 5px 5px;

  z-index: 3;
}

/* CONTROLS */
.controls {
  margin: 15px auto;
}

button {
  border: 0;

  border-radius: 14px;

  padding: 13px 28px;

  margin: 5px;

  font-size: 22px;

  font-weight: bold;

  cursor: pointer;

  background: white;

  box-shadow: 0 4px 8px #000;
}

button:active {
  transform: scale(0.9);
}

#restart {
  display: none;
  background: #ff3030;
  color: white;
}

/* MOBILE */
@media (max-width: 500px) {

  h1 {
    font-size: 23px;
  }

  #game {
    height: 570px;
  }
}
</style>
</head>

<body>

<h1>🏎️ SUPERCAR RACING</h1>

<div id="score">
  Score: 0
</div>

<div id="game">

  <div class="roadLine" style="top:0"></div>
  <div class="roadLine" style="top:160px"></div>
  <div class="roadLine" style="top:320px"></div>
  <div class="roadLine" style="top:480px"></div>

  <!-- PLAYER SUPERCAR -->

  <div id="player" class="car">

    <span class="mirror left"></span>
    <span class="mirror right"></span>

    <span class="wheel w1"></span>
    <span class="wheel w2"></span>
    <span class="wheel w3"></span>
    <span class="wheel w4"></span>

  </div>

  <!-- ENEMY -->

  <div id="enemy" class="car enemy">

    <span class="wheel w1"></span>
    <span class="wheel w2"></span>
    <span class="wheel w3"></span>
    <span class="wheel w4"></span>

  </div>

</div>

<div class="controls">

  <button onclick="moveLeft()">⬅️</button>

  <button onclick="moveRight()">➡️</button>

</div>

<button id="restart" onclick="restartGame()">
  🔄 RESTART
</button>


<script>

const player = document.getElementById("player");

const enemy = document.getElementById("enemy");

const scoreText = document.getElementById("score");

const game = document.getElementById("game");

const restartBtn = document.getElementById("restart");


let playerX = 159;

let enemyX =
  Math.random() * (game.clientWidth - 62);

let enemyY = -120;

let score = 0;

let speed = 5;

let gameOver = false;


player.style.left =
  playerX + "px";

enemy.style.left =
  enemyX + "px";


/* LEFT */

function moveLeft() {

  if (gameOver) return;

  playerX -= 40;

  if (playerX < 5) {
    playerX = 5;
  }

  player.style.left =
    playerX + "px";
}


/* RIGHT */

function moveRight() {

  if (gameOver) return;

  playerX += 40;

  if (
    playerX >
    game.clientWidth - 67
  ) {
    playerX =
      game.clientWidth - 67;
  }

  player.style.left =
    playerX + "px";
}


/* KEYBOARD */

document.addEventListener(
  "keydown",
  function(e) {

    if (
      e.key === "ArrowLeft" ||
      e.key === "a"
    ) {
      moveLeft();
    }

    if (
      e.key === "ArrowRight" ||
      e.key === "d"
    ) {
      moveRight();
    }

  }
);


/* COLLISION */

function collision(a, b) {

  const r1 =
    a.getBoundingClientRect();

  const r2 =
    b.getBoundingClientRect();

  return !(
    r1.bottom < r2.top ||
    r1.top > r2.bottom ||
    r1.right < r2.left ||
    r1.left > r2.right
  );
}


/* GAME LOOP */

function gameLoop() {

  if (gameOver) return;

  enemyY += speed;

  enemy.style.top =
    enemyY + "px";


  /* CRASH */

  if (
    collision(player, enemy)
  ) {

    endGame();

    return;
  }


  /* ENEMY PASSED */

  if (
    enemyY >
    game.clientHeight
  ) {

    score++;

    scoreText.innerText =
      "Score: " + score;

    /* SPEED INCREASE */

    speed += 0.35;

    enemyY = -120;

    enemyX =
      Math.random() *
      (game.clientWidth - 62);

    enemy.style.left =
      enemyX + "px";
  }


  requestAnimationFrame(
    gameLoop
  );
}


/* GAME OVER */

function endGame() {

  gameOver = true;

  scoreText.innerText =
    "💥 GAME OVER | Score: " +
    score;

  restartBtn.style.display =
    "inline-block";
}


/* RESTART */

function restartGame() {

  playerX = 159;

  enemyX =
    Math.random() *
    (game.clientWidth - 62);

  enemyY = -120;

  score = 0;

  speed = 5;

  gameOver = false;


  player.style.left =
    playerX + "px";

  enemy.style.left =
    enemyX + "px";

  enemy.style.top =
    enemyY + "px";


  scoreText.innerText =
    "Score: 0";

  restartBtn.style.display =
    "none";


  requestAnimationFrame(
    gameLoop
  );
}


gameLoop();

</script>

</body>
</html>
